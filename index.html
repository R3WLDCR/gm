<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Werewolf Game Master App</title>
    <meta name="theme-color" content="#0c7a67" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="人狼GM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="title-row">
          <p class="eyebrow">Werewolf Game Master</p>
          <span id="appVersionBadge" class="version-badge">v1.11.1</span>
        </div>
        <div class="top-actions">
          <details id="syncPanel" class="sync-panel">
            <summary>
              <span id="syncStatusBadge" class="sync-status-badge">端末内</span>
              <span>同期設定</span>
              <span id="syncStatusText">端末内に保存中</span>
            </summary>
            <div id="syncConfigNotice" class="sync-notice" hidden>同期設定を確認してください</div>
            <div id="syncSignedOutPanel" class="sync-auth-panel" hidden>
              <form id="loginForm" class="sync-form">
                <input id="loginEmailInput" type="email" placeholder="メール" autocomplete="email" />
                <input id="loginPasswordInput" type="password" placeholder="パスワード" autocomplete="current-password" />
                <button class="primary-button" type="submit">ログイン</button>
              </form>
              <form id="signupForm" class="sync-form">
                <input id="signupEmailInput" type="email" placeholder="メール" autocomplete="email" />
                <input id="signupPasswordInput" type="password" placeholder="パスワード" autocomplete="new-password" />
                <button class="secondary-button" type="submit">登録</button>
              </form>
            </div>
            <div id="syncSignedInPanel" class="sync-signed-in" hidden>
              <span id="syncAccountEmail">-</span>
              <span>最終同期: <strong id="lastSyncText">未同期</strong></span>
              <div class="sync-actions">
                <button id="manualSyncBtn" class="secondary-button" type="button">同期</button>
                <button id="downloadCloudBtn" class="secondary-button" type="button" hidden>クラウド取得</button>
                <button id="uploadLocalBtn" class="secondary-button" type="button" hidden>この端末で上書き</button>
                <button id="logoutBtn" class="secondary-button" type="button">ログアウト</button>
              </div>
            </div>
          </details>
          <button id="resetFirstNightBtn" class="secondary-button danger" type="button">初日へ戻す</button>
        </div>
      </header>

      <nav class="screen-tabs" aria-label="画面切り替え">
        <button class="screen-tab active" data-screen="setup" type="button">名簿</button>
        <button class="screen-tab" data-screen="deal" type="button">円卓</button>
        <button class="screen-tab" data-screen="table" type="button">昼</button>
        <button class="screen-tab" data-screen="action" type="button">夜</button>
        <button class="screen-tab" data-screen="log" type="button">ログ</button>
      </nav>

      <div id="victoryBanner" class="victory-banner" hidden>
        <img class="victory-image victory-image-werewolf" src="./images/werewolf-victory.png" alt="人狼勝利" />
        <img class="victory-image victory-image-village" src="./images/village-victory.png" alt="市民勝利" />
        <div class="victory-phone" aria-hidden="true">
          <div class="victory-phone-notch"></div>
          <div id="victoryVisualMark" class="victory-visual-mark">✦</div>
          <div class="victory-silhouettes">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="victory-claw">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="victory-copy">
          <span id="victoryLeadText">ゲーム終了</span>
          <strong id="victoryWinnerText">市民勝利</strong>
          <p id="victoryMessageText">人狼の脅威は去りました。</p>
        </div>
        <button id="victoryBackBtn" class="victory-back-button" type="button" hidden>GM画面へ戻る</button>
      </div>

      <main class="workspace">
        <section class="panel setup-panel screen-panel active" data-screen-panel="setup">
          <div class="panel-heading">
            <div></div>
            <span id="balanceBadge" class="status-badge">0 / 0</span>
          </div>

          <div class="field-row">
            <label for="playerName">参加者</label>
            <div class="inline-entry">
              <input id="playerName" type="text" placeholder="名前" autocomplete="off" />
              <button id="addPlayerBtn" class="primary-button">追加</button>
            </div>
          </div>

          <div class="player-sort-tabs" aria-label="名簿の並び替え">
            <button class="playerSortBtn active" data-sort="manual" type="button">手動順</button>
            <button class="playerSortBtn" data-sort="daily" type="button">今日</button>
            <button class="playerSortBtn" data-sort="total" type="button">累計</button>
          </div>

          <div id="playerList" class="player-list" aria-live="polite"></div>

          <button id="startBtn" class="primary-button wide">スタート</button>

        </section>

        <section class="panel deal-panel screen-panel" data-screen-panel="deal" aria-labelledby="dealTitle">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Round Table</p>
              <h2 id="dealTitle">円卓</h2>
            </div>
            <div class="panel-actions">
              <button id="progressStartBtn" class="primary-button" hidden>スタート</button>
              <button id="startRoleDealBtn" class="secondary-button">配役</button>
              <button id="shuffleSeatsBtn" class="secondary-button">席替え</button>
              <span id="dealPlayerCount" class="status-badge">0人</span>
            </div>
          </div>
          <div id="roundProgressStatus" class="round-progress-status">準備中</div>

          <div id="roundTable" class="round-table" aria-live="polite"></div>
        </section>

        <section class="panel table-panel screen-panel" data-screen-panel="table" aria-labelledby="tableTitle">
          <div class="phase-visual" aria-hidden="true">
            <div id="phaseOrb" class="phase-orb">
              <span id="phaseInitial">準</span>
            </div>
          </div>

          <div class="panel-heading table-heading">
            <div>
              <p class="section-kicker">Control</p>
              <h2 id="tableTitle"><span id="dayLabel">準備中</span></h2>
            </div>
          </div>

          <div class="timer-strip">
            <div class="timer-face">
              <div class="timer-ring" aria-label="残り時間">
                <div class="timer-ring-inner">
                  <span id="timerDisplay">30</span>
                  <div class="timer-controls">
                    <button id="timerStart" class="subtle-button timer-start-button">開始</button>
                    <button id="timerReset" class="subtle-button">戻る</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="timer-corner-actions">
              <button id="voteStartBtn" class="primary-button vote-start-button" hidden>投票</button>
              <button id="skipToVoteBtn" class="skip-vote-button" type="button">skip</button>
            </div>
            <div class="timer-keypad" aria-label="タイマー分数">
              <button class="timerPresetBtn" data-minutes="7">7</button>
              <button class="timerPresetBtn" data-minutes="8">8</button>
              <button class="timerPresetBtn" data-minutes="9">9</button>
              <button class="timerPresetBtn" data-minutes="4">4</button>
              <button class="timerPresetBtn" data-minutes="5">5</button>
              <button class="timerPresetBtn" data-minutes="6">6</button>
              <button class="timerPresetBtn" data-minutes="1">1</button>
              <button class="timerPresetBtn" data-minutes="2">2</button>
              <button class="timerPresetBtn" data-minutes="3">3</button>
            </div>
          </div>

          <div class="vote-table-actions" hidden>
            <button id="backToTimerBtn" class="secondary-button vote-back-button" type="button">戻る</button>
            <button id="pleaBtn" class="secondary-button plea-button" type="button" disabled>弁明</button>
            <button id="exileBtn" class="primary-button exile-button" disabled>追放</button>
          </div>
          <div class="vote-control-panel" hidden>
            <div id="revoteNotice" class="revote-notice" hidden>同票のため再投票</div>
            <div id="revoteAssistPanel" class="revote-assist-panel" hidden>
              <div>
                <span>円卓で投票者をタップ</span>
                <strong id="revoteFixedTargetName">投票先</strong>
                <small id="revoteAssignedText">0人選択</small>
              </div>
              <button id="revoteNextBtn" class="primary-button" type="button">次の投票先へ</button>
            </div>
            <div class="vote-input-grid">
              <label>
                投票者
                <select id="voteVoterSelect"></select>
              </label>
              <label>
                投票先
                <select id="voteTargetSelect"></select>
              </label>
              <button id="recordVoteBtn" class="primary-button" type="button">投票を記録</button>
            </div>
            <div class="vote-result-grid">
              <div>
                <p class="vote-panel-title">集計</p>
                <div id="voteSummary" class="vote-summary"></div>
              </div>
              <div>
                <p class="vote-panel-title">投票履歴</p>
                <div id="voteRecordList" class="vote-record-list"></div>
              </div>
            </div>
            <div class="vote-panel-actions">
              <button id="clearVotesBtn" class="secondary-button" type="button">投票をクリア</button>
              <button id="startRevotePleaBtn" class="primary-button" type="button" hidden>決戦弁明へ</button>
              <button id="sendTopVoteToPleaBtn" class="primary-button" type="button">最多票を弁明へ</button>
            </div>
          </div>
          <div id="voteRoundTable" class="round-table vote-round-table" aria-live="polite"></div>
          <div id="pleaTimerView" class="plea-timer-view" hidden>
            <button id="pleaBackBtn" class="secondary-button plea-back-button" type="button">戻る</button>
            <div class="plea-timer-content">
              <p class="plea-kicker">弁明</p>
              <span id="pleaTimerDisplay" class="plea-timer-display">30</span>
              <button id="pleaTimerToggleBtn" class="secondary-button plea-timer-toggle-button" type="button">開始</button>
            </div>
            <button id="pleaExileBtn" class="primary-button plea-exile-button" type="button" hidden>追放</button>
          </div>
          <div id="revotePleaTimerView" class="plea-timer-view revote-plea-timer-view" hidden>
            <button id="revotePleaBackBtn" class="secondary-button plea-back-button" type="button">戻る</button>
            <div class="plea-timer-content revote-plea-content">
              <p class="plea-kicker">決戦弁明</p>
              <small id="revotePleaProgress" class="revote-plea-progress">1 / 1</small>
              <span id="revotePleaTimerDisplay" class="plea-timer-display">30</span>
              <button id="revotePleaTimerToggleBtn" class="secondary-button plea-timer-toggle-button" type="button">開始</button>
            </div>
            <button id="revotePleaNextBtn" class="secondary-button plea-next-button" type="button" hidden>次の決戦者に</button>
            <button id="revotePleaStartBtn" class="primary-button plea-exile-button" type="button" hidden>決選投票へ</button>
          </div>

        </section>

        <section class="panel action-panel screen-panel" data-screen-panel="action" aria-labelledby="actionTitle">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Actions</p>
              <h2 id="actionTitle">夜の行動</h2>
            </div>
            <div class="panel-actions">
              <button id="previousActionRoleBtn" class="secondary-button">前の役職</button>
              <button id="nextDayBtn" class="secondary-button">次の日</button>
            </div>
          </div>

          <div class="action-stack">
            <div class="action-status">
              <strong id="actionRoleTitle">夜の行動</strong>
              <span id="actionHelp">対象を選んでください</span>
            </div>
            <div id="actionRoundTable" class="round-table action-round-table" aria-live="polite"></div>
          </div>
        </section>

        <section class="panel log-panel screen-panel" data-screen-panel="log" aria-labelledby="logTitle">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Log</p>
              <h2 id="logTitle">進行ログ</h2>
            </div>
            <button id="copyLogBtn" class="secondary-button">コピー</button>
          </div>
          <div id="logList" class="log-list"></div>
        </section>
      </main>
    </div>

    <dialog id="roleDialog" class="role-dialog">
      <form method="dialog">
        <p id="roleDialogName" class="dialog-name"></p>
        <h3 id="roleDialogRole"></h3>
        <p id="roleDialogTeam" class="dialog-team"></p>
        <button class="primary-button wide">閉じる</button>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./sync-config.js?v=20260616-vecfhdcvywjvziguhmvj"></script>
    <script src="./app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).then((registration) => {
            registration.update();
          });

          let refreshed = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (refreshed) return;
            refreshed = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
